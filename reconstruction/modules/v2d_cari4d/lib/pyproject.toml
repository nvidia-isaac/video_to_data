[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2d-cari4d-lib"
version = "0.1.0"
description = "CARI4D monocular human-object reconstruction inference and training"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub",
    "imgaug==0.4.0",
    "transformers==5.3.0",
    "v2d-foundation-pose-lib",
    "v2d-common[io]",
    "v2d-moge-lib",
    "v2d-sam3d-body-lib",
]

[tool.setuptools]
packages = ["v2d.cari4d.lib"]

[tool.setuptools.package-dir]
"v2d.cari4d.lib" = "."
