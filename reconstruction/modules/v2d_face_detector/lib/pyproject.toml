[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2d-face-detector-lib"
version = "0.1.0"
description = "Multiview face detection, temporal stabilization, and blurring"
requires-python = ">=3.10"
dependencies = [
    "av",
    "h5py",
    "imageio[pyav]",
    "numpy",
    "omegaconf",
    "opencv-python-headless>=4.10,<5",
    "tqdm",
    "v2d-common",
    "v2d-mv",
]

[tool.setuptools]
packages = ["v2d.face_detector.lib"]

[tool.setuptools.package-data]
"v2d.face_detector.lib" = ["*.yaml"]

[tool.setuptools.package-dir]
"v2d.face_detector.lib" = "."
