[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2d-hoi-object-reconstruction-docker"
version = "0.1.0"
description = "Docker orchestration scripts for HOI object reconstruction"
requires-python = ">=3.10"
dependencies = [
    "v2d-docker",                  # provides the generic container launcher
    "v2d-foundation-pose-docker",  # provides v2d.foundation_pose.docker
    "v2d-grounding-dino-docker",   # canonical Grounding DINO container wrapper
    "v2d-sam3d-docker",            # lightweight SAM3D container wrappers
    "PyYAML>=6,<7",                 # host-side pipeline configuration parsing
]

[tool.setuptools]
packages = ["v2d_hoi_object_reconstruction.docker"]

[tool.setuptools.package-dir]
"v2d_hoi_object_reconstruction.docker" = "."

[tool.setuptools.package-data]
"v2d_hoi_object_reconstruction.docker" = ["data/configs/*.yaml"]
