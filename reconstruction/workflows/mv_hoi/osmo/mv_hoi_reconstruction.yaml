# MV HOI Reconstruction OSMO Workflow.
#
# Usage:
#   osmo workflow submit reconstruction/workflows/mv_hoi/osmo/mv_hoi_reconstruction.yaml \
#     --set image_registry="$V2D_IMAGE_REGISTRY" \
#     --set mv_preprocess_url=swift://.../<dataset>/data_output/<seq>/mv_preprocess/ \
#     --set face_detector_url=swift://.../<dataset>/data_output/<seq>/face_detector/ \
#     --set swift_output_base=swift://.../<dataset>/data_output/<seq> \
#     --pool <pool>

workflow:
  name: {{workflow_name}}
  resources:
    gpu:
      cpu: 8
      gpu: 1
      memory: 64Gi
      storage: 100Gi
    cpu_large:
      cpu: 32
      gpu: 0
      memory: 64Gi
      storage: 100Gi
    cpu_small:
      cpu: 8
      gpu: 0
      memory: 32Gi
      storage: 50Gi

  tasks:

  # Verify the mutable human bbox prompts still match the submission snapshot.
  - name: validate_labeled_bboxes
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    resource: cpu_small
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    outputs:
    - url: {{swift_output_base}}/validate_labeled_bboxes/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        echo "{{expected_labeled_bboxes_manifest_b64}}" \
          | base64 --decode > /tmp/labeled_bboxes_manifest.json
        python -m v2d.mv.postprocess.lib.verify_bbox_manifest \
          --bbox-dir {{input:0}}/labeled_bboxes \
          --expected-sha256 {{expected_labeled_bboxes_sha256}} \
          --expected-manifest-json /tmp/labeled_bboxes_manifest.json \
          --rgb-dir {{input:0}}/images \
          --preview-dir {{output}}/prompts
        echo "{{expected_labeled_bboxes_sha256}}" > {{output}}/sha256

  # Stereo depth estimation
  - name: foundation_stereo
    resource: gpu
    image: "{{image_registry}}/mv_hoi_foundation_stereo:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - url: {{weights_base_url}}/foundation_stereo/
    outputs:
    - url: {{swift_output_base}}/foundation_stereo/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        MODEL_NAME=deployable_foundationstereo_small_576x960_v2.0.onnx
        if [ ! -f "{{input:1}}/$MODEL_NAME" ]; then
          echo "ERROR: Foundation Stereo ONNX not found: {{input:1}}/$MODEL_NAME"
          exit 1
        fi
        MODEL_DIR=/tmp/foundation_stereo_weights
        mkdir -p "$MODEL_DIR"
        cp "{{input:1}}/$MODEL_NAME" "$MODEL_DIR/$MODEL_NAME"
        ENGINE_NAME=$(python -c \
          'from v2d.foundation_stereo.lib.export_engine import get_versioned_engine_filename; print(get_versioned_engine_filename())')
        if [ -f "{{input:1}}/$ENGINE_NAME" ]; then
          echo "Using provisioned architecture-specific TensorRT engine: $ENGINE_NAME"
          cp "{{input:1}}/$ENGINE_NAME" "$MODEL_DIR/$ENGINE_NAME"
        else
          echo "No compatible provisioned TensorRT engine; building from ONNX"
        fi

        taskset -c "$CPU_LIST" python -m v2d.foundation_stereo.lib.mv_image_list_to_depth \
          --camera_params_path {{input:0}}/edex \
          --rgb_dir {{input:0}}/images \
          --output_dir {{output}} \
          --model_dir "$MODEL_DIR" \
          --config_path /tmp/depth_config.yaml
    - path: /tmp/depth_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        depth_path_template: "${output_dir}/{cam_name}/depth.h5"

  # Object bounding-box detection (Grounding DINO)
  - name: grounding_dino
    resource: gpu
    image: "{{image_registry}}/mv_hoi_grounding_dino:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - url: {{weights_base_url}}/grounding_dino/
    outputs:
    - url: {{swift_output_base}}/grounding_dino/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        BBOX_SOURCE_FILE={{input:0}}/object_bbox_source.txt
        if [ -f "$BBOX_SOURCE_FILE" ]; then
          BBOX_SOURCE=$(tr -d '\r\n' < "$BBOX_SOURCE_FILE")
          if [ "$BBOX_SOURCE" = "manual_labeled_bboxes" ]; then
            echo "Manual object bbox prompts found; skipping GroundingDINO"
            mkdir -p "{{output}}"
            exit 0
          fi
          echo "ERROR: unknown object bbox source '$BBOX_SOURCE'"
          exit 1
        fi

        if [ ! -s "{{input:0}}/prompt.txt" ]; then
          echo "ERROR: no manual bbox marker and no nonempty prompt.txt"
          exit 1
        else
          echo "Using GroundingDINO prompt from mv_preprocess/prompt.txt"
        fi
        if [ ! -f "{{input:1}}/groundingdino_swint_ogc.pth" ]; then
          echo "ERROR: Grounding DINO checkpoint not found under {{input:1}}"
          exit 1
        fi

        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        taskset -c "$CPU_LIST" python -m v2d.grounding_dino.lib.mv_image_list_to_object_bboxes \
          --rgb_dir {{input:0}}/images \
          --prompt_path {{input:0}}/prompt.txt \
          --output_dir {{output}} \
          --model_dir {{input:1}} \
          --config_path /tmp/grounding_dino_config.yaml
    - path: /tmp/grounding_dino_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"

  # Object masks (SAM2 with JSON bbox prompts)
  - name: sam2_object_masks
    resource: gpu
    image: "{{image_registry}}/mv_hoi_sam2:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - task: grounding_dino
    - url: {{mv_preprocess_url}}
    - url: {{weights_base_url}}/sam2/
    - task: validate_labeled_bboxes
    outputs:
    - url: {{swift_output_base}}/sam2_object_masks/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"
        test -f "{{input:2}}/sam2.1_hiera_large.pt"
        test -f "{{input:2}}/sam2.1_hiera_l.yaml"

        BBOX_DIR={{input:0}}
        BBOX_SOURCE_FILE={{input:1}}/object_bbox_source.txt
        if [ -f "$BBOX_SOURCE_FILE" ]; then
          BBOX_SOURCE=$(tr -d '\r\n' < "$BBOX_SOURCE_FILE")
          if [ "$BBOX_SOURCE" = "manual_labeled_bboxes" ]; then
            BBOX_DIR={{input:1}}/labeled_bboxes
            echo "Using manual object bbox prompts from $BBOX_DIR"
          else
            echo "ERROR: unknown object bbox source '$BBOX_SOURCE'"
            exit 1
          fi
        fi

        taskset -c "$CPU_LIST" python -m v2d.sam2.lib.mv_videos_to_masks \
          --bbox_dir "$BBOX_DIR" \
          --rgb_dir {{input:1}}/images \
          --output_dir {{output}} \
          --weights_dir {{input:2}} \
          --config_path /tmp/sam2_object_config.yaml
    - path: /tmp/sam2_object_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        bbox_path_template: "${bbox_dir}/{cam_name}.json"
        mask_extension: ".h5"

  # Gate: object mask containment vs labeled bboxes
  - name: check_object_mask
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    resource: cpu_small
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - task: sam2_object_masks
    - url: {{mv_preprocess_url}}
    outputs:
    - url: {{swift_output_base}}/check_object_mask/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        python -m v2d.mv.postprocess.lib.check_object_mask \
          --mask_dir {{input:0}} \
          --labeled_bbox_dir {{input:1}}/labeled_bboxes \
          --output_dir {{output}} \
          --min_containment {{min_mask_containment}} \
          --bbox_padding {{mask_bbox_padding}} \
          --report-only

  # Object pose tracking (FoundationPose)
  - name: foundation_pose
    resource: gpu
    image: "{{image_registry}}/mv_hoi_foundation_pose:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - task: check_object_mask
    - url: {{mv_preprocess_url}}
    - task: foundation_stereo
    - task: sam2_object_masks
    - url: {{weights_base_url}}/foundation_pose/
    outputs:
    - url: {{swift_output_base}}/foundation_pose/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"
        MODEL_DIR={{input:4}}/nvidia_tensorrt/deployable_v1.0
        test -f "$MODEL_DIR/refiner_net.onnx"
        test -f "$MODEL_DIR/score_net.onnx"
        test -f "$MODEL_DIR/manifest.json"
        export FOUNDATIONPOSE_ENGINE_CACHE_DIR=/tmp/foundation_pose_engine_cache
        mkdir -p "$FOUNDATIONPOSE_ENGINE_CACHE_DIR"

        MESH={{input:1}}/object_mesh/output_aligned.glb
        SYM={{input:1}}/object_mesh/output_symmetry.json
        if [ ! -f "$MESH" ]; then
          echo "ERROR: $MESH not found"
          ls -laR {{input:1}}/object_mesh
          exit 1
        fi
        SYM_ARG=""
        if [ -f "$SYM" ]; then
          SYM_ARG="--symmetry_path $SYM"
          echo "Using symmetry: $SYM"
        fi
        taskset -c "$CPU_LIST" python -m v2d.foundation_pose.lib.mv_videos_to_poses \
          --camera_params_path {{input:1}}/edex \
          --rgb_dir {{input:1}}/images \
          --depth_dir {{input:2}} \
          --mask_dir {{input:3}} \
          --mesh_path "$MESH" \
          $SYM_ARG \
          --weights_dir {{input:4}} \
          --backend nvidia_tensorrt \
          --output_dir {{output}} \
          --config_path /tmp/foundation_pose_config.yaml
    - path: /tmp/foundation_pose_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        depth_path_template: "${depth_dir}/{cam_name}/depth.h5"
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"
        continuous_symmetry_step_deg: {{continuous_symmetry_step_deg}}

  # Human bounding-box detection + tracking (Detectron2)
  - name: detectron2
    resource: gpu
    image: "{{image_registry}}/mv_hoi_detectron2:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - url: {{weights_base_url}}/detectron2/
    outputs:
    - url: {{swift_output_base}}/detectron2/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"
        test -f "{{input:1}}/cascade_mask_rcnn_vitdet_b/model_final_435fa9.pkl"

        taskset -c "$CPU_LIST" python -m v2d.detectron2.lib.mv_track_bboxes \
          --rgb_dir {{input:0}}/images \
          --weights_dir {{input:1}} \
          --output_dir {{output}} \
          --config_path /tmp/detectron2_config.yaml
    - path: /tmp/detectron2_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"

  # Human masks (SAM2 with detectron2 PT bboxes)
  - name: sam2_human_masks
    resource: gpu
    image: "{{image_registry}}/mv_hoi_sam2:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - task: detectron2
    - url: {{mv_preprocess_url}}
    - url: {{weights_base_url}}/sam2/
    outputs:
    - url: {{swift_output_base}}/sam2_human_masks/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"
        test -f "{{input:2}}/sam2.1_hiera_large.pt"
        test -f "{{input:2}}/sam2.1_hiera_l.yaml"

        taskset -c "$CPU_LIST" python -m v2d.sam2.lib.mv_videos_to_masks \
          --bbox_dir {{input:0}} \
          --rgb_dir {{input:1}}/images \
          --output_dir {{output}} \
          --weights_dir {{input:2}} \
          --config_path /tmp/sam2_human_config.yaml
    - path: /tmp/sam2_human_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        mask_extension: ".h5"

  # Human body reconstruction (SAM3D-Body)
  - name: sam3d_body
    resource: gpu
    image: "{{image_registry}}/mv_hoi_sam3d_body:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: detectron2
    - task: sam2_human_masks
    - url: {{weights_base_url}}/sam3d_body/
    outputs:
    - url: {{swift_output_base}}/sam3d_body/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"
        test -f "{{input:3}}/sam-3d-body-dinov3/model.ckpt"
        test -f "{{input:3}}/sam-3d-body-dinov3/model_config.yaml"
        test -f "{{input:3}}/sam-3d-body-dinov3/assets/mhr_model.pt"
        test -f "{{input:3}}/dinov3_repo.tar.gz"
        export TORCH_HOME=/tmp/sam3d_torch_home
        mkdir -p "$TORCH_HOME/hub"
        tar -xzf "{{input:3}}/dinov3_repo.tar.gz" -C "$TORCH_HOME/hub"
        test -f "$TORCH_HOME/hub/facebookresearch_dinov3_main/hubconf.py"

        taskset -c "$CPU_LIST" python -m v2d.sam3d_body.lib.mv_optimize_mhr_params \
          --camera_params_path {{input:0}}/edex \
          --rgb_dir {{input:0}}/images \
          --bbox_dir {{input:1}} \
          --mask_dir {{input:2}} \
          --weights_dir {{input:3}} \
          --output_dir {{output}} \
          --config_path /tmp/sam3d_body_config.yaml
    - path: /tmp/sam3d_body_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"
        sam3d_body_batch_size: 16

  # Export MHR parameters to SOMA format
  - name: export_soma
    resource: gpu
    image: "{{image_registry}}/mv_hoi_sam3d_body:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - task: sam3d_body
    - url: {{weights_base_url}}/sam3d_body/hf_home/
    outputs:
    - url: {{swift_output_base}}/export_soma/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        export HF_HOME="{{input:1}}"
        export HF_HUB_OFFLINE=1
        export XDG_CACHE_HOME=/tmp/soma_x_runtime_cache
        SOMA_REPO="$HF_HOME/hub/models--nvidia--soma-x"
        test -f "$SOMA_REPO/refs/main"
        SOMA_REVISION=$(tr -d '\r\n' < "$SOMA_REPO/refs/main")
        test "$SOMA_REVISION" = "{{soma_x_revision}}"
        SOMA_SNAPSHOT="$SOMA_REPO/snapshots/$SOMA_REVISION"
        test -f "$SOMA_SNAPSHOT/SOMA_neutral.npz"
        test -f "$SOMA_SNAPSHOT/MHR/mhr_model_lod1.pt"
        python -c 'from pathlib import Path; from soma.assets import get_assets_dir; expected = Path("'"$SOMA_SNAPSHOT"'").resolve(); actual = get_assets_dir().resolve(); assert actual == expected, (actual, expected); print(f"Using offline SOMA-X assets: {actual}")'

        taskset -c "$CPU_LIST" python -m v2d.sam3d_body.lib.export_soma \
          --params_path {{input:0}}/mhr_params_mv.pt \
          --mesh_path {{input:0}}/mhr_mesh_mv.pt \
          --output_path {{output}}/soma_params.npz \
          --body-iters 2 \
          --finger-iters 0 \
          --full-iters 1 \
          --lie-iters 0 \
          --autograd-iters 400 \
          --autograd-lr 0.0025 \
          --autograd-translation-lr-scale 5 \
          --autograd-pose-prior 1 \
          --autograd-pose-prior-weights heel_contact \
          --autograd-hand-weight 5 \
          --autograd-foot-weight 20 \
          --device cuda \
          --debug 1

  # Ground plane estimation (depth + MHR foot keypoints)
  - name: estimate_ground_plane
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    resource: cpu_large
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: foundation_stereo
    - task: sam3d_body
    outputs:
    - url: {{swift_output_base}}/estimate_ground_plane/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        python -m v2d.mv.postprocess.lib.mv_estimate_ground_plane \
          --camera_params_path {{input:0}}/edex \
          --depth_dir {{input:1}} \
          --human_pose_dir {{input:2}} \
          --rgb_dir {{input:0}}/images \
          --output_dir {{output}} \
          --config_path /tmp/ground_plane_config.yaml
    - path: /tmp/ground_plane_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        depth_path_template: "${depth_dir}/{cam_name}/depth.h5"
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"

  # Fused multiview point cloud export
  - name: export_fused_pointcloud
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    resource: cpu_large
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: foundation_stereo
    outputs:
    - url: {{swift_output_base}}/export_fused_pointcloud/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        python -m v2d.mv.postprocess.lib.mv_export_fused_pointcloud \
          --camera_params_path {{input:0}}/edex \
          --depth_dir {{input:1}} \
          --rgb_dir {{input:0}}/images \
          --output_dir {{output}} \
          --config_path /tmp/fused_pointcloud_config.yaml
    - path: /tmp/fused_pointcloud_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.h5"
        depth_path_template: "${depth_dir}/{cam_name}/depth.h5"
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"

  # Chamfer evaluation – object
  - name: eval_chamfer_object
    resource: gpu
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: foundation_pose
    - task: foundation_stereo
    - task: sam2_object_masks
    outputs:
    - url: {{swift_output_base}}/eval_chamfer_object/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        MESH={{input:0}}/object_mesh/output_aligned.glb
        if [ ! -f "$MESH" ]; then
          echo "ERROR: $MESH not found"
          exit 1
        fi
        taskset -c "$CPU_LIST" python -m v2d.mv.postprocess.lib.mv_eval_chamfer_object \
          --camera_params_path {{input:0}}/edex \
          --object_mesh_path "$MESH" \
          --object_pose_dir {{input:1}} \
          --depth_dir {{input:2}} \
          --mask_dir {{input:3}} \
          --output_dir {{output}} \
          --config_path /tmp/chamfer_object_config.yaml
    - path: /tmp/chamfer_object_config.yaml
      contents: |-
        depth_path_template: "${depth_dir}/{cam_name}/depth.h5"
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"
        camera_workers: 4
        profile: true
        progress_interval: 0.1

  # Chamfer evaluation – human
  - name: eval_chamfer_human
    resource: gpu
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: sam3d_body
    - task: foundation_stereo
    - task: sam2_human_masks
    outputs:
    - url: {{swift_output_base}}/eval_chamfer_human/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        taskset -c "$CPU_LIST" python -m v2d.mv.postprocess.lib.mv_eval_chamfer_human \
          --camera_params_path {{input:0}}/edex \
          --human_pose_dir {{input:1}} \
          --depth_dir {{input:2}} \
          --mask_dir {{input:3}} \
          --output_dir {{output}} \
          --config_path /tmp/chamfer_human_config.yaml
    - path: /tmp/chamfer_human_config.yaml
      contents: |-
        depth_path_template: "${depth_dir}/{cam_name}/depth.h5"
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"
        camera_workers: 4
        profile: true
        progress_interval: 0.1

  # 2D silhouette-vs-SAM2 evaluation and object alignment decision
  - name: eval_silhouette_mask_object
    resource: gpu
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: foundation_pose
    - task: sam2_object_masks
    outputs:
    - url: {{swift_output_base}}/eval_silhouette_mask_object/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        MESH={{input:0}}/object_mesh/output_aligned.glb
        if [ ! -f "$MESH" ]; then
          echo "ERROR: $MESH not found"
          exit 1
        fi
        taskset -c "$CPU_LIST" python -m v2d.mv.postprocess.lib.mv_eval_silhouette_mask_object \
          --camera_params_path {{input:0}}/edex \
          --object_mesh_path "$MESH" \
          --object_pose_dir {{input:1}} \
          --mask_dir {{input:2}} \
          --output_dir {{output}} \
          --config_path /tmp/silhouette_mask_object_config.yaml
    - path: /tmp/silhouette_mask_object_config.yaml
      contents: |-
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"
        min_mask_pixels: {{min_object_segment_pixels}}
        min_bbox_containment: {{min_object_silhouette_bbox_containment}}
        min_bbox_component_pixels: {{min_object_bbox_component_pixels}}
        min_bbox_component_fraction_of_largest: {{min_object_bbox_component_fraction_of_largest}}
        render_bbox_padding_pixels: {{object_silhouette_render_bbox_padding_pixels}}
        render_bbox_padding_fraction: {{silhouette_render_bbox_padding_fraction}}
        max_bad_frame_fraction: {{max_object_silhouette_bad_frame_fraction}}
        camera_workers: 4
        profile: true
        progress_interval: 0.1

  # 2D silhouette-vs-SAM2 evaluation – human (report-only)
  - name: eval_silhouette_mask_human
    resource: gpu
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: sam3d_body
    - task: sam2_human_masks
    outputs:
    - url: {{swift_output_base}}/eval_silhouette_mask_human/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        taskset -c "$CPU_LIST" python -m v2d.mv.postprocess.lib.mv_eval_silhouette_mask_human \
          --camera_params_path {{input:0}}/edex \
          --human_pose_dir {{input:1}} \
          --mask_dir {{input:2}} \
          --output_dir {{output}} \
          --config_path /tmp/silhouette_mask_human_config.yaml
    - path: /tmp/silhouette_mask_human_config.yaml
      contents: |-
        mask_path_template: "${mask_dir}/{cam_name}/${mask_obj_id}.h5"
        min_mask_pixels: {{min_silhouette_mask_pixels}}
        min_bbox_component_pixels: {{min_silhouette_bbox_component_pixels}}
        min_bbox_component_fraction_of_largest: {{min_silhouette_bbox_component_fraction_of_largest}}
        render_bbox_padding_pixels: {{silhouette_render_bbox_padding_pixels}}
        render_bbox_padding_fraction: {{silhouette_render_bbox_padding_fraction}}
        camera_workers: 4
        profile: true
        progress_interval: 0.1

  # Render HOI overlay videos
  - name: render_hoi_overlay
    resource: gpu
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: foundation_pose
    - task: sam3d_body
    - url: {{face_detector_url}}
    outputs:
    - url: {{swift_output_base}}/render_hoi_overlay/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        # Find the GPU's NUMA node and pin to its CPUs
        PCI_ID=$(nvidia-smi --query-gpu=pci.bus_id -i 0 --format=csv,noheader \
                 | tr '[:upper:]' '[:lower:]' | sed 's/^0000//')
        NUMA_NODE=$(cat /sys/bus/pci/devices/${PCI_ID}/numa_node 2>/dev/null || echo 0)
        [ "$NUMA_NODE" = "-1" ] && NUMA_NODE=0
        CPU_LIST=$(cat /sys/devices/system/node/node${NUMA_NODE}/cpulist)
        echo "GPU NUMA node: $NUMA_NODE, pinning to CPUs: $CPU_LIST"

        MESH={{input:0}}/object_mesh/output_aligned.glb
        if [ ! -f "$MESH" ]; then
          echo "ERROR: $MESH not found"
          exit 1
        fi
        taskset -c "$CPU_LIST" python -m v2d.mv.postprocess.lib.mv_render_hoi_overlay \
          --camera_params_path {{input:0}}/edex \
          --object_mesh_path "$MESH" \
          --object_pose_dir {{input:1}} \
          --human_pose_dir {{input:2}} \
          --rgb_dir {{input:3}}/videos \
          --output_dir {{output}} \
          --config_path /tmp/render_overlay_config.yaml
    - path: /tmp/render_overlay_config.yaml
      contents: |-
        rgb_path_template: "${rgb_dir}/{cam_name}.mp4"
        render_workers: 4
        profile: true
        progress_interval: 0.1

  # Final QC gate – aggregate chamfer, mask-containment, and object alignment checks
  - name: check_accuracy
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    resource: cpu_small
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - task: eval_chamfer_object
    - task: eval_chamfer_human
    - task: check_object_mask
    - task: eval_silhouette_mask_object
    - task: eval_silhouette_mask_human
    # Nominal dependencies: these outputs are not consumed by check_accuracy,
    # but check_accuracy and HITL publication must not run if any task fails.
    - task: export_soma
    - task: estimate_ground_plane
    - task: export_fused_pointcloud
    outputs:
    - url: {{swift_output_base}}/check_accuracy/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        python -m v2d.mv.postprocess.lib.check_accuracy \
          --chamfer_object_dir {{input:0}} \
          --chamfer_human_dir {{input:1}} \
          --check_object_mask_dir {{input:2}} \
          --silhouette_object_dir {{input:3}} \
          --silhouette_human_dir {{input:4}} \
          --output_dir {{output}} \
          --max_chamfer_object {{max_chamfer_object}} \
          --max_chamfer_human {{max_chamfer_human}} \
          --max_chamfer_segment_object {{max_chamfer_segment_object}} \
          --max_chamfer_segment_human {{max_chamfer_segment_human}} \
          --min_silhouette_bbox_containment {{min_silhouette_bbox_containment}} \
          --min_failure_run_frames {{min_accuracy_failure_run_frames}} \
          --max_silhouette_failure_coverage {{max_silhouette_failure_coverage}}

  # HITL intake staging – OSMO copies the output to both swift_output_base
  # and hitl_s3_base. Depends on check_accuracy so it only runs on PASS.
  - name: upload_hitl
    image: "{{image_registry}}/mv_hoi_mv_postprocess:{{image_tag}}"
    resource: cpu_small
    command: [/bin/bash]
    args: [/tmp/entry.sh]
    inputs:
    - url: {{mv_preprocess_url}}
    - task: render_hoi_overlay
    - task: check_accuracy
    outputs:
    - url: {{swift_output_base}}/upload_hitl/
    - url: {{hitl_s3_base}}/{{hitl_batch_name}}/
    files:
    - path: /tmp/entry.sh
      contents: |-
        set -ex
        python -m v2d.mv.postprocess.lib.upload_hitl \
          --overlay_dir {{input:1}} \
          --hoi_metadata_path {{input:0}}/hoi_metadata.yaml \
          --output_dir {{output}} \
          --hitl_s3_base "{{hitl_s3_base}}" \
          --hitl_batch_name "{{hitl_batch_name}}" \
          --video_name "{{workflow_name}}" \
          --s3_region "{{s3_region}}"

default-values:
  image_registry: ???
  workflow_name: v2d_mv_hoi_reconstruction
  image_tag: latest
  mv_preprocess_url: ???
  face_detector_url: ???
  weights_base_url: ???
  expected_labeled_bboxes_sha256: ???
  expected_labeled_bboxes_manifest_b64: ???
  swift_output_base: ???
  max_chamfer_object: "40.0"
  max_chamfer_human: "40.0"
  max_chamfer_segment_object: "50.0"
  max_chamfer_segment_human: "50.0"
  soma_x_revision: "6db1b4e8d737db240e680ca5358ae2897f2d9427"
  min_mask_containment: "0.8"
  mask_bbox_padding: "0.1"
  min_object_silhouette_bbox_containment: "0.8"
  min_object_segment_pixels: "10"
  min_object_bbox_component_pixels: "3"
  min_object_bbox_component_fraction_of_largest: "0.001"
  object_silhouette_render_bbox_padding_pixels: "8"
  max_object_silhouette_bad_frame_fraction: "0.05"
  min_silhouette_bbox_containment: "0.8"
  min_silhouette_mask_pixels: "10"
  min_silhouette_bbox_component_pixels: "3"
  min_silhouette_bbox_component_fraction_of_largest: "0.001"
  silhouette_render_bbox_padding_pixels: "8"
  silhouette_render_bbox_padding_fraction: "0.1"
  min_accuracy_failure_run_frames: "5"
  max_silhouette_failure_coverage: "0.5"
  hitl_s3_base: ???
  hitl_batch_name: ???
  s3_region: "us-west-2"
