# MV HOI batched export OSMO workflow template.
#
# export.py renders concrete per-sequence tasks into the marker below and writes the
# generated workflow under osmo/generated/<export_name>/workflow.yaml.

workflow:
  name: {{workflow_name}}
  resources:
    cpu_export:
      cpu: 16
      gpu: 0
      memory: 32Gi
      storage: 100Gi

  tasks:
__TASKS__

default-values:
  image_registry: ???
  workflow_name: v2d_mv_hoi_export
  image_tag: latest
