[project]
name = "video_ingestion_agent"
version = "0.1.0"
description = "Entity graph-based agentic workflow for robot demonstration video analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "NVIDIA Isaac Team", email = "TODO@nvidia.com"}
]
keywords = [
    "robotics",
    "video-understanding",
    "entity-graphs",
    "agentic-workflows",
    "robot-learning",
    "policy-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core (lightweight -- sufficient for vLLM backend)
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",

    # Agentic workflows
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # API clients
    "requests>=2.31.0",
    "openai>=1.0.0",       # For vLLM / API backends

    # Database
    "sqlalchemy>=2.0.0",

    # Utilities
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Heavy GPU deps for local model inference (vlm_backend: "local")
local = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "timm>=0.9.0",           # For SigLIP
    "bitsandbytes>=0.43.0",  # For quantization
    # Video decoder for transformers >=5 (torchvision.io.read_video is gone
    # in 0.26). Bounds track torch 2.11 compat; bump deliberately with torch.
    "torchcodec>=0.11,<0.16",
]

# vLLM server. One stack serves every backend: Qwen3-VL needs plain vLLM;
# Cosmos3-Nano additionally needs the vllm-cosmos3 plugin (pulls
# transformers 5.x). History of the old `vllm>=0.12,<0.13` pin, retired
# after re-validation on 0.21:
#   - the 0.20+ "encoder cache size 8192" HTTP 400 on video items is an
#     admission-ceiling artifact fixed in scripts/serve.py (raised
#     max_pixels default; see the comment there), not a model regression;
#   - the 0.20+ Qwen3-VL deepstack-tokens regression did not reproduce
#     on 0.21 (stir-bowl smoke + HoT3D S1 A/B);
#   - the 0.13-era ~6x TP=8 multimodal prefill slowdown was re-benchmarked
#     on 0.21 via the HoT3D S1 A/B on groot-h100-01 (see
#     docs/experiment_log.md).
# vllm-cosmos3 is pinned to the exact rev validated in that A/B image;
# bump deliberately, never implicitly (upstream HEAD moves).
# ninja: flashinfer JIT-compiles kernels at engine init (Qwen too, not
# just Cosmos3) and shells out to `ninja`, else EngineCore dies with
# FileNotFoundError. The host also needs the CUDA 13 toolkit on PATH
# (CUDA_HOME) for that JIT; the Docker image ships it via the devel base.
server = [
    "vllm>=0.21,<0.22",
    "vllm-cosmos3 @ git+https://github.com/NVIDIA/cosmos-framework.git@8ea43183588961648a8fd8cf33866c849eeaa21d#subdirectory=packages/vllm-cosmos3",
    # The validated serving stack runs transformers 5.12-5.13 (SigLIP handled
    # via the pooler_output compat path). Both bounds are load-bearing:
    # nothing upstream forces 5.x (transformers-cosmos3 only floors at
    # >=4.57), so without the floor a re-lock silently settles back to 4.x;
    # and 5.14.x breaks vllm 0.21's import chain (NameError: SpecialTokens in
    # transformers/tokenization_mistral_common.py, imported unconditionally
    # by vllm's CLI) — caught by the in-image serve smoke test.
    "transformers>=5,<5.14",
    "ninja>=1.11",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.5.0",
]

docs = [
    "sphinx>=7.0,<8.3",
    "nvidia-sphinx-theme>=0.0.8",
    "sphinx-multiversion>=0.2.4",
    "sphinx_copybutton>=0.5.2",
    "sphinx_tabs>=3.4.7",
    "sphinx_design>=0.6.1",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinx-autobuild>=2024.0.0",
]

viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "networkx>=3.2.0",
]

webapp = [
    "gradio>=6.0.0",
    "plotly>=5.18.0",
    "networkx>=3.2.0",
]

benchmark = [
    "sentence-transformers>=2.2.0",
    "bert-score>=0.3.13",
    "pandas>=1.5.0",
    "joblib>=1.0.0",
    "wandb>=0.16.0",
]

all = [
    "video_ingestion_agent[local,server,dev,docs,viz,webapp,benchmark]",
]

[project.urls]
Homepage = "https://github.com/nvidia-isaac/video_to_data/tree/main/video_ingestion_agent"
Documentation = "https://github.com/nvidia-isaac/video_to_data/tree/main/video_ingestion_agent"
Repository = "https://github.com/nvidia-isaac/video_to_data"
Issues = "https://github.com/nvidia-isaac/video_to_data/issues"

[tool.uv]
# GPU serving stack is linux-only; restricting the universal resolution
# keeps the cu130 torch index from breaking the lock on other platforms.
environments = ["sys_platform == 'linux'"]

# vllm 0.21 / torch 2.11 must come from the cu130 wheel index so the
# bundled CUDA libs match the CUDA 13 base image (Dockerfile) and the
# CUDA 13.1 host toolchain. `uv pip install --torch-backend=cu130` is
# install-time only and would not survive `uv sync`; this is the
# declarative, lock-recorded equivalent.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_ingestion_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "C408",  # unnecessary dict() call - common in Plotly code
    "UP038", # use X | Y in isinstance - less readable for multiple types
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=video_ingestion_agent",
    "--cov-report=term-missing",
    "--cov-report=html",
]
