[project]
name = "flash_chord"
version = "0.4.0"
description = "Reference implementation for FlashCHORD robotic reference tracking"
requires-python = ">=3.11,<3.13"
dependencies = [
    "coacd==1.0.11",  # convex decomposition of object collision meshes (Newton has no built-in)
    "hydra-core==1.3.2",
    "imageio-ffmpeg==0.6.0",  # stream Newton GL frames into reproducible MP4 policy visualizations
    "imgui-bundle==1.92.801",  # Newton GL viewer UI
    "mujoco==3.8.1",  # pin the native bindings paired with mujoco-warp
    "mujoco-warp==3.8.1",
    "newton==1.2.0",
    "numpy==2.4.6",
    "omegaconf==2.3.1",
    "onnxruntime-gpu==1.28.0",
    "pillow==12.2.0",  # Newton GL viewer icons and textures
    "pyarrow==24.0.0",  # reference sequence loading
    "pyglet==2.1.14",  # Newton GL window and headless rendering backend
    "scipy==1.17.1; python_version < '3.12'",  # trajectory resampling and rotation utilities
    "scipy==1.18.0; python_version >= '3.12'",  # same direct dependency on the supported Python 3.12 path
    "trimesh==4.12.2",  # Newton URDF mesh loading and offline decomposition
    "usd-core==26.5",  # sequence support-surface loading
    "viser==1.0.30",  # browser-based interactive viewer
    "warp-lang==1.14.0",
]

[project.optional-dependencies]
# `uv.lock` is the single pinned dependency source used by the container.
# Install the development extra for the complete test suite.
dev = ["pytest>=8.0"]
train = [
    "distrax==0.1.9",
    "flax==0.12.7",
    "jax[cuda13]==0.10.2",
    "optax==0.2.8",
    "safetensors==0.8.0",
    "wandb==0.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flash_chord"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.pydocstyle]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (skipped when unavailable)",
    "sequence_data: requires optional local reference sequence corpora",
    "slow: long-running simulation/integration test",
]
