_target_: flash_chord.configuration.make_fixed_curriculum

# PPO iterations. The first seven stages preserve robotic_grounding's exact
# G1SonicReconBodyVOCCurriculumCfg. Starting at iteration 16,500, deployment-
# exact frame-zero resets are mixed in gradually without a settling preamble.
# Hold the terminal mixture at 50% so every update continues to see uniform
# suffix/recovery starts as well as exact deployment starts. 20,000 is the
# terminal sentinel for the experiment budget.
thresholds: [2000, 4000, 6000, 8000, 10000, 12000, 16500, 17500, 20000]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 1.0
    objective_weights: &recon_body_weights
      termination: -300.0
      action_rate_l2: -0.0001
      action_l2: -0.000001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.75
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.5
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.25
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.1
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.05
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
    immediate_first_frame_probability: 0.25
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
    immediate_first_frame_probability: 0.50
