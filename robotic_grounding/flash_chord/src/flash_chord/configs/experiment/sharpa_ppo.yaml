# @package _global_

# Canonical floating Sharpa-hand PPO reference recipe.
defaults:
  - override /sim: rl
  - override /scene: train
  - override /collision: training
  - override /embodiment: sharpa_hands
  - override /action: residual_hand_pose
  - override /observation: policy
  - override /objective: tracking
  - override /termination: tracking
  - override /reset: reference
  - override /env: rl
  - override /curriculum: reference
  - override /training: reference_ppo
