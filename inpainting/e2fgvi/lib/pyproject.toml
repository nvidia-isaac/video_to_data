[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2d-inpainting-e2fgvi-lib"
version = "0.1.0"
description = "Container-side E2FGVI video inpainting and CPU-only validation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]

[project.scripts]
v2d-e2fgvi-inpaint = "v2d.inpainting.e2fgvi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["v2d.inpainting.e2fgvi*", "mmcv*"]
namespaces = true
